name: Build and publish

# Push sur main → image construite et publiée sur GHCR (tags « latest » et SHA du commit).
# Puis le workflow de sites-infra déploie l'image sur 192.168.11.134 (VPN + SSH).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # À adapter dans chaque repo : nom de l'image utilisé dans sites-infra/docker-compose.yml.
  IMAGE: ghcr.io/hug0003/site-natours
  # Dossier du Dockerfile : « . » pour un site statique, « osculte » ou « pizzeria » pour Django.
  CONTEXT: .

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runners GitHub par défaut. Pour un runner auto-hébergé : variable de dépôt RUNS_ON = self-hosted.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sur une pull request, l'image est seulement construite (vérifie que le build passe).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Demande à sites-infra de déployer la nouvelle image sur 192.168.11.134 (VPN géré là-bas).
      # Secret SITES_DEPLOY_TOKEN : jeton fine-grained limité au repo sites-infra (Contents: Read and write).
      - name: Trigger deployment
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.SITES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret SITES_DEPLOY_TOKEN absent : image publiée mais pas déployée."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Hug0003/sites-infra/dispatches \
            -d '{"event_type":"site-updated","client_payload":{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'