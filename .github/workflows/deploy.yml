name: Build and publish

# Push sur main → image construite et publiée sur GHCR (tags « latest » et SHA du commit).
# Le serveur 192.168.11.134 n'est pas joignable depuis GitHub (VPN) : c'est lui qui vient
# chercher la nouvelle image toutes les 2 minutes (timer sites-update de sites-infra).
# Aucun secret, aucun VPN, aucune connexion SSH dans ce workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # À adapter dans chaque repo : nom de l'image utilisé dans sites-infra/docker-compose.yml.
  IMAGE: ghcr.io/hug0003/site-natours
  # Dossier du Dockerfile : « . » pour un site statique, « osculte » ou « pizzeria » pour Django.
  CONTEXT: .

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runners GitHub par défaut. Pour un runner auto-hébergé : variable de dépôt RUNS_ON = self-hosted.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sur une pull request, l'image est seulement construite (vérifie que le build passe).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
