server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le site est servi sous hugomeuriel.fr/projets/<nom>/ par l'Apache de 192.168.11.131 :
    # les redirections doivent rester relatives (ni http:// ni port interne).
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # Site statique : seules les lectures sont acceptées.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Fichiers cachés et fichiers de travail qui n'ont rien à faire en ligne.
    location ~ /\. {
        return 404;
    }
    location ~* \.(py|md|scss|sass|map|tar\.gz|zip|sh|lock)$ {
        return 404;
    }

    location ~* \.(css|js|webp|png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
        # add_header dans un bloc location annule ceux du serveur : on les remet.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
}
